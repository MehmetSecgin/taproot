interface:
  display_name: "TapRoot"
  short_description: "Operate TapRoot for DB queries, doctor checks, credential setup, and schema context."
  default_prompt: "Use $taproot to run a TapRoot workflow and explain the result. When table or column context is needed, run a cheap query on the table and read `meta.schemaContext.tables.<table>` from the result."

policy:
  allow_implicit_invocation: true
